<template>
    <lightning-card title="Meu Saldo de Férias" icon-name="custom:custom97">
        <div slot="actions">
            <lightning-button label="Agendar" variant="brand" icon-name="utility:event" onclick={handleAgendar}></lightning-button>
        </div>

        <div class="slds-p-horizontal_medium">
            <template if:true={loading}>
                <div class="slds-text-align_center slds-p-vertical_large">
                    <lightning-spinner alternative-text="Carregando" size="small"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-text-color_error slds-p-vertical_medium">
                    Não foi possível carregar seu saldo: {error}
                </div>
            </template>

            <template if:true={noSaldo}>
                <div class="slds-text-color_weak slds-p-vertical_medium">
                    Você ainda não tem um período aquisitivo vigente.
                </div>
            </template>

            <template if:true={hasSaldo}>
                <div class="grid">
                    <div class="progress-wrapper">
                        <div class="progress-ring" style={progressStyle}>
                            <div class="progress-inner">
                                <div class="progress-value">{diasDisponiveis}</div>
                                <div class="progress-label">dias<br/>disponíveis</div>
                            </div>
                        </div>
                    </div>
                    <div class="stats">
                        <div class="stat-row">
                            <span class="stat-label">Regime</span>
                            <span class="stat-value">
                                <lightning-badge label={regime}></lightning-badge>
                            </span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Direito no período</span>
                            <span class="stat-value stat-highlight">{diasDireito} dias</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Já tirados</span>
                            <span class="stat-value">{diasTirados} dias</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Concessivo até</span>
                            <span class="stat-value">
                                <lightning-formatted-date-time value={concessivoFim} year="numeric" month="short" day="2-digit"></lightning-formatted-date-time>
                            </span>
                        </div>
                    </div>
                </div>
            </template>

            <template if:true={hasSolicitacoes}>
                <div class="requests">
                    <h3 class="requests-title">Solicitações recentes</h3>
                    <template for:each={solicitacoes} for:item="solicitacao">
                        <article key={solicitacao.Id} class="request-item">
                            <div class="request-header">
                                <span class="request-number">#{solicitacao.CaseNumber}</span>
                                <span class={solicitacao.statusClass}>{solicitacao.statusLabel}</span>
                            </div>
                            <div class="request-dates">
                                <template if:true={solicitacao.isAprovada}>Datas confirmadas:</template>
                                <template if:false={solicitacao.isAprovada}>Datas solicitadas:</template>
                                <lightning-formatted-date-time value={solicitacao.Data_Inicio_Ferias__c} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
                                -
                                <lightning-formatted-date-time value={solicitacao.Data_Retorno_Ferias__c} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
                            </div>
                        </article>
                    </template>
                </div>
            </template>

            <template if:true={hasSaldoSemSolicitacoes}>
                <div class="requests-empty">
                    Nenhuma solicitação recente de férias.
                </div>
            </template>
        </div>
    </lightning-card>
</template>
